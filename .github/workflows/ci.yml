name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # prisma generate (postinstall) yalnızca değerin varlığına ihtiyaç duyar; gerçek bir veritabanına bağlanılmaz.
      DATABASE_URL: postgresql://user:pass@localhost:5432/test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
